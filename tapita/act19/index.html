<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Operadores aritméticos con JavaScript</title>
        <link rel="stylesheet" href="style.css">
        <script src="operaciones.js" defer></script>
    </head>
    <body>
        <main>
            <header>
                <img class="title" src="title.png" alt="Operadores aritméticos con JavaScript" width="100%" height="80%">
            </header>
            <p>Ingrese los valores en los dos campos:</p><br>
            <label for="campoN1"></label>
            <input type="number" id="campoN1" min="0" step="1">
            <label for="campoN2"></label>
            <input type="number" id="campoN2" min="0" step="1">
            <br><br>
            <button class="button" id="btnSuma">Sumar</button>
            <button class="button" id="btnResta">Resta</button>
            <button class="button" id="btnMultiplicacion">Multiplicación</button>
            <button class="button" id="btnDivision">Division</button>
            <button class="button" id="btnComparacion">Comparar</button>
            <article class="respuesta">
                <br>
                <img class="equal" src="equal.png" alt="=" width="8%" height="20%">
                <br><br><br>
                <h3 id="resultado"></h3>
            </article>
        </main>
    </body>
    <footer>
        <hr><br>
            <img class="name" src="name.gif" alt="Mauricio Chavoya Soto"><br>
            <img class="info" src="info.gif" alt="Tecnologo Profesional en Sistemas Informaticos Septimo Semestre / Aula F8 / 01 de Octubre del 2026"><br><br>
            <img src="badge.gif">
    </footer>
</html>
