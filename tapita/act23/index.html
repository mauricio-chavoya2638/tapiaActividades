<!DOCTYPE html>
<html lang="es">
    <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tabla de Multiplicar con ciclo for</title>
            <link rel="stylesheet" href="style.css">
            <script src="tabla.js" defer></script>
    </head>
    <body>
        <main>
            <header>
                <img class="title" src="title.png" alt="Par, Impar o Cero">
            </header>
            <section class="data">
                <p>
                    Escriba el numero para generar su tabla:
                </p>
                <form>
                    <label for="campoN"></label>
                    <input type="number" id="campoN" step="1" required>
                    <br><br>
                    <button class="button" id="btnGenerar">Generar</button>
                    <br><br>
                </form>
                <article class="respuesta">
                    <br>
                    <img src="equal.png" alt="=" width="60px" height="50px">
                    <br><br><br>
                    <h3 id="resultado"></h3>
                </article>
            </section>
        </main>
        <footer>
            
            <hr><br>
            <img class="name" src="name.gif" alt="Mauricio Chavoya Soto"><br>
            <img class="info" src="info.gif" alt="Tecnologo Profesional en Sistemas Informaticos Septimo Semestre / Aula F8 / 01 de Octubre del 2026"><br><br>
            <img class="badge" src="badge.gif">
        </footer>
    </body>
</html>
