<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista dinámica con JavaScript</title>
        <link rel="stylesheet" href="style.css">
        <script src="lista.js" defer></script>
    </head>
    <body>
        <header>
            <img src="title.png" width="90%" height="90%">
            <img src="subtitle.png" width="60%" height="60%">
        </header>
        <main>
            <section class="nodo">
                <article class="campo">
                <label for="elemento">Escribe el elemento que deseas agregar:</label>
                <input type="text" id="elemento" required>
                </article>
                <button type="button" id="btnAgregar">Agregar elemento</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
                <section class="lista">
                    <h3>Elementos agregados</h3>
                    <ul id="lista"></ul>
                </section>
            </section>
        </main>
        <footer>
            <p>Mauricio Chavoya Soto</p>
            <p>Séptimo semestre / Grupo B / Turno Vespertino</p><br>
        <img src="badge.gif">
    </footer>
    </body>
</html>
